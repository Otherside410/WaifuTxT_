name: Build & Deploy

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/otherside410/waifutxt

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          # Tailscale IP of orangepi5ultra (MagicDNS: orangepi5ultra.taile540e0.ts.net).
          # The Pi is no longer reachable from the public internet.
          host: 100.123.32.111
          port: 7200
          username: orangepi
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/docker/waifu-matrix
            docker compose pull
            docker compose up -d --remove-orphans

  notify:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: 🟢 Notification Matrix (Succès)
        if: ${{ needs.build.result == 'success' && needs.deploy.result == 'success' }}
        env:
          MATRIX_HOMESERVER: ${{ secrets.MATRIX_HOMESERVER }}
          MATRIX_USERNAME: ${{ secrets.MATRIX_USERNAME }}
          MATRIX_PASSWORD: ${{ secrets.MATRIX_PASSWORD }}
          MATRIX_ROOM_ID: ${{ secrets.MATRIX_ROOM_ID }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
        run: |
          set -e
          # 1. LOGIN : Récupération d'un token tout neuf
          LOGIN_BODY=$(jq -n \
            --arg user "$MATRIX_USERNAME" \
            --arg pass "$MATRIX_PASSWORD" \
            '{type:"m.login.password", identifier:{type:"m.id.user", user:$user}, password:$pass}')
          LOGIN_RESP=$(curl -s -X POST "$MATRIX_HOMESERVER/_matrix/client/v3/login" \
            -H "Content-Type: application/json" \
            -d "$LOGIN_BODY")
          TOKEN=$(echo "$LOGIN_RESP" | jq -r .access_token)
          if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
            ERRCODE=$(echo "$LOGIN_RESP" | jq -r '.errcode // "UNKNOWN"')
            ERRMSG=$(echo "$LOGIN_RESP" | jq -r '.error // "no error field"')
            RETRY_MS=$(echo "$LOGIN_RESP" | jq -r '.retry_after_ms // "n/a"')
            echo "❌ Échec de la connexion Matrix."
            echo "   errcode       : $ERRCODE"
            echo "   error         : $ERRMSG"
            echo "   retry_after_ms: $RETRY_MS"
            exit 1
          fi

          # 2. NOTIFY : Envoi du message avec un ID de transaction unique
          TXN_ID=$(date +%s%N)
          BODY_TEXT=$(printf '✅ Déploiement [Prod] Réussi !\nLe code de %s a été mis en ligne avec succès.\n📝 Commit : %s' "$ACTOR" "$COMMIT_MSG")
          BODY_HTML=$(printf '✅ <strong>Déploiement [Prod] Réussi !</strong><br>Le code de <strong>%s</strong> a été mis en ligne avec succès.<br>📝 Commit : %s' "$ACTOR" "$COMMIT_MSG")
          PAYLOAD=$(jq -n \
            --arg body "$BODY_TEXT" \
            --arg fbody "$BODY_HTML" \
            '{msgtype:"m.text", format:"org.matrix.custom.html", body:$body, formatted_body:$fbody}')
          curl -s -X PUT "$MATRIX_HOMESERVER/_matrix/client/v3/rooms/$MATRIX_ROOM_ID/send/m.room.message/$TXN_ID" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

          # 3. LOGOUT : Destruction de la session (CRITIQUE)
          curl -s -X POST "$MATRIX_HOMESERVER/_matrix/client/v3/logout" \
            -H "Authorization: Bearer $TOKEN"

      - name: 🔴 Notification Matrix (Échec)
        if: ${{ needs.build.result == 'failure' || needs.deploy.result == 'failure' }}
        env:
          MATRIX_HOMESERVER: ${{ secrets.MATRIX_HOMESERVER }}
          MATRIX_USERNAME: ${{ secrets.MATRIX_USERNAME }}
          MATRIX_PASSWORD: ${{ secrets.MATRIX_PASSWORD }}
          MATRIX_ROOM_ID: ${{ secrets.MATRIX_ROOM_ID }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          # 1. LOGIN
          LOGIN_BODY=$(jq -n \
            --arg user "$MATRIX_USERNAME" \
            --arg pass "$MATRIX_PASSWORD" \
            '{type:"m.login.password", identifier:{type:"m.id.user", user:$user}, password:$pass}')
          LOGIN_RESP=$(curl -s -X POST "$MATRIX_HOMESERVER/_matrix/client/v3/login" \
            -H "Content-Type: application/json" \
            -d "$LOGIN_BODY")
          TOKEN=$(echo "$LOGIN_RESP" | jq -r .access_token)
          if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
            ERRCODE=$(echo "$LOGIN_RESP" | jq -r '.errcode // "UNKNOWN"')
            ERRMSG=$(echo "$LOGIN_RESP" | jq -r '.error // "no error field"')
            RETRY_MS=$(echo "$LOGIN_RESP" | jq -r '.retry_after_ms // "n/a"')
            echo "❌ Échec de la connexion Matrix."
            echo "   errcode       : $ERRCODE"
            echo "   error         : $ERRMSG"
            echo "   retry_after_ms: $RETRY_MS"
            exit 1
          fi

          # 2. NOTIFY
          TXN_ID=$(date +%s%N)
          BODY_TEXT=$(printf '❌ Échec du déploiement [Prod] !\nUne erreur est survenue lors de l’intégration du code de %s.\n🔍 Logs : %s' "$ACTOR" "$RUN_URL")
          BODY_HTML=$(printf '❌ <strong>Échec du déploiement [Prod] !</strong><br>Une erreur est survenue lors de l’intégration du code de <strong>%s</strong>.<br>🔍 <a href="%s">Vérifier les logs du run</a>' "$ACTOR" "$RUN_URL")
          PAYLOAD=$(jq -n \
            --arg body "$BODY_TEXT" \
            --arg fbody "$BODY_HTML" \
            '{msgtype:"m.text", format:"org.matrix.custom.html", body:$body, formatted_body:$fbody}')
          curl -s -X PUT "$MATRIX_HOMESERVER/_matrix/client/v3/rooms/$MATRIX_ROOM_ID/send/m.room.message/$TXN_ID" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

          # 3. LOGOUT
          curl -s -X POST "$MATRIX_HOMESERVER/_matrix/client/v3/logout" \
            -H "Authorization: Bearer $TOKEN"
