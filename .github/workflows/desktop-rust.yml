name: Desktop Rust (natif GPUI)

# Build, tests et distribution du client natif (desktop/). Workflow SÉPARÉ de desktop-build.yml (Electron) : les deux
# cohabitent pendant le chantier. NON EXÉCUTÉ à la date d'écriture (aucun push autorisé) : les commandes du job Linux ont été
# rejouées à la main sur la VM de développement, celles du job Windows n'ont jamais tourné (voir .design/RAPPORT-W07.md).
#
# Secrets / variables attendus (à créer par Otherside, rien n'est créé ici) :
#   vars.WAIFU_UPDATE_PUBKEY          clé publique ed25519 de mise à jour (hex, 64 car.), compilée dans le binaire
#   secrets.WAIFU_UPDATE_SIGNING_KEY  clé secrète correspondante (hex, 64 car.), utilisée seulement pour signer un manifeste

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-rust.yml"
  push:
    tags:
      - "desktop-v*"

concurrency:
  group: desktop-rust-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: desktop

env:
  CARGO_TERM_COLOR: always
  WAIFU_UPDATE_PUBKEY: ${{ vars.WAIFU_UPDATE_PUBKEY }}

jobs:
  linux:
    name: Linux (build, tests, AppImage)
    # ubuntu-latest a glissé sur Ubuntu 26.04 (glibc 2.43) en nov. 2026 : tout binaire compilé sur le runner exigeait
    # 2.43 et mourait sur Fedora/Nobara sans message (t_936d72cd, récidive du 16/11). L'AppImage est désormais compilée
    # DANS le conteneur Debian 12 ci-dessous (glibc 2.36) : la glibc du runner n'entre plus dans le binaire distribué.
    # L'épinglage 24.04 est une ceinture pour tout ce qui tourne encore sur l'hôte du job.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Cache chaud : le registre vivait déjà dans ~/.cargo avant le passage au conteneur ; il est maintenant dans
      # $RUNNER_TEMP/cache/cargo (CARGO_HOME). Sans ça, chaque run repart à froid (~18 min de compilation).
      - uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/cache/cargo
            ${{ runner.temp }}/cache/target
          key: desktop-rust-deb12-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: desktop-rust-deb12-${{ runner.os }}-

      # Build + tests + AppImage dans un conteneur debian:12-slim (glibc 2.36) : un binaire n'est exécutable que sur une
      # glibc >= à celle de compilation. `ubuntu-latest` a glissé sur Ubuntu 26.04 (glibc 2.43) et a produit une AppImage
      # inutilisable sur Fedora/Nobara (récidive du 16/11 puis du 25/11, t_936d72cd). Ne jamais compiler l'AppImage sur le runner.
      - name: Image de build (debian:12-slim)
        working-directory: .
        run: docker build -t waifu-build:debian12 -f desktop/packaging/Containerfile.build desktop/packaging

      # Les tests d'intégration contre un homeserver sont #[ignore] : aucun Synapse sur le runner.
      # Le composant clippy est installé dans l'image (Containerfile.build) : /opt/rustup n'est pas inscriptible
      # pour l'utilisateur du conteneur, donc `rustup component add` est impossible ici.
      - name: Build, clippy, tests, AppImage (conteneur Debian 12)
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cache/tools"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE":/src \
            -v "$RUNNER_TEMP/cache":/cache \
            -e HOME=/cache/home -e CARGO_HOME=/cache/cargo -e CARGO_TARGET_DIR=/cache/target \
            -e APPIMAGETOOL=/cache/tools/appimagetool-x86_64.AppImage \
            -e WAIFU_UPDATE_PUBKEY -e CARGO_TERM_COLOR \
            -w /src/desktop waifu-build:debian12 bash -euo pipefail -c '
              mkdir -p "$HOME"
              # Cible hors du target de la machine hote : build-appimage.sh honore CARGO_TARGET_DIR.
              cargo build --release --locked
              test -x /cache/target/release/waifu-desktop || { echo "binaire absent dans /cache/target/release" >&2; exit 1; }
              cargo clippy --all-targets --locked -- -D warnings
              cargo test --locked
              bash packaging/build-appimage.sh
            '

      # Garde-fou : le plancher glibc du binaire distribué doit rester <= 2.39 (mesuré sur le binaire extrait de l'AppImage).
      - name: Plancher glibc <= 2.39
        run: |
          set -euo pipefail
          cd packaging
          chmod +x WaifuChat-*-x86_64.AppImage
          ./WaifuChat-*-x86_64.AppImage --appimage-extract >/dev/null
          FLOOR="$(objdump -T squashfs-root/usr/bin/waifu-desktop | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1)"
          echo "plancher glibc : $FLOOR"
          [ "$(printf '%s\n' "$FLOOR" GLIBC_2.39 | sort -V | tail -1)" = "GLIBC_2.39" ] || { echo "plancher trop haut : $FLOOR" >&2; exit 1; }
          rm -rf squashfs-root

      - name: Empreinte
        working-directory: desktop/packaging
        run: sha256sum WaifuChat-*-x86_64.AppImage | tee WaifuChat.AppImage.sha256

      # Le manifeste n'est pas un binaire distribué : il peut être produit avec la toolchain du runner (la contrainte
      # glibc ne porte que sur l'AppImage, déjà construite et vérifiée ci-dessus). Uniquement sur tag.
      - name: Chaîne Rust (manifeste uniquement, tag desktop-v*)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # Manifeste signé : uniquement sur un tag, avec le secret. La clé n'est écrite que dans un fichier temporaire du runner.
      - name: Manifeste signé (tag desktop-v*)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          SIGNING_KEY: ${{ secrets.WAIFU_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [ -n "$SIGNING_KEY" ] || { echo "secret WAIFU_UPDATE_SIGNING_KEY absent" >&2; exit 1; }
          VERSION="$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml | head -n1)"
          APPIMAGE="packaging/WaifuChat-${VERSION}-x86_64.AppImage"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$APPIMAGE")"
          KEYFILE="$(mktemp)"; trap 'shred -u "$KEYFILE" 2>/dev/null || rm -f "$KEYFILE"' EXIT
          umask 077; printf '%s' "$SIGNING_KEY" > "$KEYFILE"
          cargo run --release --locked -p updater --bin waifu-updater -- manifest --version "$VERSION" --url "$URL" --file "$APPIMAGE" --out packaging/manifest.json
          cargo run --release --locked -p updater --bin waifu-updater -- sign --key "$KEYFILE" packaging/manifest.json
          cat packaging/manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: waifuchat-linux
          path: |
            desktop/packaging/WaifuChat-*-x86_64.AppImage
            desktop/packaging/WaifuChat.AppImage.sha256
            desktop/packaging/manifest.json
            desktop/packaging/manifest.json.sig
          if-no-files-found: error

  windows:
    name: Windows (NSIS + portable)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Chaîne Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version

      - name: NSIS
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            desktop\target
          key: desktop-rust-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: desktop-rust-${{ runner.os }}-

      - name: cargo test
        run: cargo test --locked

      - name: NSIS + portable
        run: ./packaging/build-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: waifuchat-windows
          path: |
            desktop/packaging/out/WaifuChat-*-x64-setup.exe
            desktop/packaging/out/WaifuChat-*-x64-portable.exe
          if-no-files-found: error
