[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.67.0"
edition = "2021"
publish = false

[workspace.dependencies]
gpui-kit = "=0.9.1"
domain = { path = "crates/domain" }
ui = { path = "crates/ui" }

[profile.dev]
# 0 et non 1 : moins de code généré et d'octets écrits (target plus petit, donc moins tenté d'être nettoyé).
debug = 0

[profile.dev.package."*"]
debug = false
