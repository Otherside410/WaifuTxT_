[package]
name = "updater"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "waifu-updater"
path = "src/bin/waifu-updater.rs"

# Dépendances nouvelles pour ce crate, toutes DÉJÀ présentes dans desktop/Cargo.lock (aucune crate de plus à télécharger) :
# voir `.design/RAPPORT-W07.md`, section « Demandes ».
[dependencies]
ed25519-dalek = { version = "3", default-features = false, features = ["zeroize"] }
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"

[dev-dependencies]
tempfile = "3"
